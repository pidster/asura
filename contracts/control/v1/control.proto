syntax = "proto3";
package asura.control.v1;

message Envelope {
  optional bytes service_epoch = 1;
  optional bytes attachment_id = 2;
  optional uint64 request_counter = 3;
  oneof body {
    Hello hello = 10;
    HelloReply hello_reply = 11;
    Inspect inspect = 12;
    InspectReply inspect_reply = 13;
    Stop stop = 14;
    StopAccepted stop_accepted = 15;
    Error error = 16;
    InspectInstallation inspect_installation = 17;
    InspectInstallationReply inspect_installation_reply = 18;
    ConfigGet config_get = 19;
    ConfigSet config_set = 20;
    ConfigReply config_reply = 21;
    ConversationObserve conversation_observe = 24;
    ConversationEvent conversation_event = 25;
    ConversationCancel conversation_cancel = 26;
    ConversationCancelAccepted conversation_cancel_accepted = 27;
    InitializeInstallation initialize_installation = 28;
    InitializationReply initialization_reply = 29;
    ResolveInitialization resolve_initialization = 30;
    ProjectRegister project_register = 31;
    ProjectReply project_reply = 32;
    ProjectList project_list = 33;
    ProjectsReply projects_reply = 34;
    ConversationQueueList conversation_queue_list = 36;
    ConversationQueueDecision conversation_queue_decision = 37;
    ConversationQueueReply conversation_queue_reply = 38;
    ObserveContext observe_context = 39;
    ContextObservation context_observation = 40;
    ObserveService observe_service = 41;
    ServiceObservation service_observation = 42;
    ModelsList models_list = 43;
    ModelsReply models_reply = 44;
    SensorsInspect sensors_inspect = 45;
    SensorsReply sensors_reply = 46;
    AuditRead audit_read = 47;
    AuditReply audit_reply = 48;
    ConversationHistory conversation_history = 49;
    ConversationHistoryReply conversation_history_reply = 50;
    ConversationReadPrompt conversation_read_prompt = 51;
    ConversationPromptReply conversation_prompt_reply = 52;
    ConversationQueueSubmit conversation_queue_submit = 53;
    ConversationQueueReorder conversation_queue_reorder = 54;
    ProjectRename project_rename = 55;
    ProjectRenameReply project_rename_reply = 56;
    // Tool job controller J4 (tool-job-controller.md, J4 control messages).
    JobList job_list = 57;
    JobListReply job_list_reply = 58;
    JobInspect job_inspect = 59;
    JobDetail job_detail = 60;
    JobRead job_read = 61;
    // Replies to JobRead and JobObserve.
    JobPage job_page = 62;
    JobObserve job_observe = 63;
    JobCancel job_cancel = 64;
    JobCancelReply job_cancel_reply = 65;
    JobRetain job_retain = 66;
    JobRetainReply job_retain_reply = 67;
    // Person command mode (person-command-mode.md, control API additions).
    // Replied to with ConversationQueueReply.
    ConversationQueueCommandSubmit conversation_queue_command_submit = 68;
    // Execution path guard (execution-path-guard.md, control messages).
    // List, Approve and Revoke are replied to with PathGuardReply.
    PathGuardList path_guard_list = 69;
    PathGuardReply path_guard_reply = 70;
    PathGuardApprove path_guard_approve = 71;
    PathGuardRevoke path_guard_revoke = 72;
  }
  // Removed operations: direct ConversationSubmit (22) and its reply (23), and
  // the target-bearing ConversationEnqueue (35). Conversation input uses the queue.
  reserved 22, 23, 35;
}
message ObserveService { optional uint64 after_revision = 1; }
message ServiceObservation {
  optional uint64 revision = 1;
  optional bool pending = 2;
  optional InspectReply status = 3;
  optional string configured_model = 4;
  optional uint64 uptime_ms = 5;
  optional StoredMemoryStatus stored_memory = 6;
  // The configured thinking level (thinking-level.md).
  optional ThinkingLevel thinking_level = 7;
  // The secret store worker's counts (secret-store.md, operations and audit).
  optional SecretStoreStatus secret_store = 8;
}
message SecretStoreStatus {
  optional uint32 item_count = 1;         // every listed item, 0-257; 257 means more than 256
  optional bool sweep_pending = 2;        // startup sweep deferred
  optional uint32 last_status = 3;        // 0, or the last unavailable OSStatus as its absolute value
  optional uint32 stranded_count = 4;     // items whose delete was denied, 0-257
  optional uint32 unrecognized_count = 5; // items whose account is not input.<32 hex>, 0-257
  repeated bytes stranded_inputs = 6;     // at most 16 input IDs of 16 bytes each
}
// The person's thinking level and the form sent for a turn (thinking-level.md).
enum ThinkingLevel { THINKING_LEVEL_DEFAULT = 0; THINKING_LEVEL_OFF = 1; THINKING_LEVEL_LOW = 2; THINKING_LEVEL_MEDIUM = 3; THINKING_LEVEL_HIGH = 4; }
enum ThinkingRequest { THINKING_REQUEST_NONE = 0; THINKING_REQUEST_OFF = 1; THINKING_REQUEST_ON = 2; THINKING_REQUEST_LOW = 3; THINKING_REQUEST_MEDIUM = 4; THINKING_REQUEST_HIGH = 5; }
message StoredMemoryStatus {
  optional bool available = 1;
  optional uint64 size_bytes = 2;
  optional uint64 sampled_uptime_ms = 3;
  optional bool stale = 4;
  optional uint32 size_reason = 5;
}
message ConfigGet { optional string key = 1; }
message ObserveContext {
  optional bytes project_id = 1;
  optional string working_directory = 2;
  optional bytes after_subscription = 3;
  optional uint64 after_revision = 4;
}
message ContextObservation {
  optional bytes project_id = 1;
  optional string working_directory = 2;
  optional bytes subscription_id = 3;
  optional uint64 revision = 4;
  optional bool pending = 5;
  optional uint32 git_state = 6; // 0 unknown, 1 nonrepository, 2 clean, 3 dirty
  optional string branch = 7;
  optional bool detached = 8;
  optional bool unborn = 9;
  optional bool conflicts = 10;
  optional string reason = 11;
  optional uint64 files_changed = 12;
  optional uint64 added = 13;
  optional uint64 deleted = 14;
}
message ConfigSet { optional string key = 1; optional string value_yaml = 2; }
message ConfigReply { optional string value_yaml = 1; optional string error = 2; }
message Hello { optional string client_build = 1; }
message HelloReply {
  optional string service_build = 1;
  repeated Capability capabilities = 2 [packed = true];
  optional uint32 max_frame_bytes = 3;
}
message Inspect {}
message InspectReply {
  optional Lifecycle lifecycle = 1;
  optional InstallationState installation = 2;
  reserved 3;
  optional InstallationInspectionReason reason = 4;
  optional bool new_installation = 5;
}
message InspectInstallation {}
message InspectInstallationReply {
  optional InstallationState installation = 1;
  optional InstallationInspectionReason reason = 2;
  optional bytes installation_id = 3;
  optional uint64 authority_revision = 4;
  optional uint64 recorded_owner_generation = 5;
  optional uint64 binding_generation = 6;
  optional uint32 authority_format = 7;
  optional bool new_installation = 8;
}
message Stop { optional bytes expected_epoch = 1; }
message StopAccepted {}
message Error {
  optional ErrorCode code = 1;
  optional string message = 2;
}
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_INSPECT = 1;
  CAPABILITY_STOP = 2;
  CAPABILITY_INSPECT_INSTALLATION = 3;
  CAPABILITY_CONFIG = 4;
  CAPABILITY_CONVERSATION = 5;
  CAPABILITY_SETUP = 6;
  // Job requests 57-67; listed once J3 and J4 are enabled (EN1).
  CAPABILITY_JOBS = 7;
  // Person command submit 68; listed only once packets P1-P5 and Q pass (OD3).
  CAPABILITY_PERSON_COMMAND = 8;
}
enum Lifecycle {
  LIFECYCLE_UNSPECIFIED = 0;
  LIFECYCLE_STARTING = 1;
  LIFECYCLE_SERVING = 2;
  LIFECYCLE_DRAINING = 3;
  LIFECYCLE_FAULTED = 4;
  LIFECYCLE_REPAIR_ONLY = 5;
}
enum InstallationState {
  INSTALLATION_STATE_UNSPECIFIED = 0;
  INSTALLATION_STATE_UNAVAILABLE = 1;
  INSTALLATION_STATE_UNINITIALIZED = 2;
  INSTALLATION_STATE_RECOVERING = 3;
  INSTALLATION_STATE_GRAPH_UNAVAILABLE = 4;
  INSTALLATION_STATE_REPAIR_REQUIRED = 5;
  INSTALLATION_STATE_GRAPH_READY = 6;
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_OPERATION = 1;
  ERROR_CODE_INVALID_SEQUENCE = 2;
  ERROR_CODE_STALE_OWNER = 3;
  ERROR_CODE_DRAINING = 4;
  ERROR_CODE_TIMEOUT = 5;
  ERROR_CODE_INVALID_REQUEST = 6;
  ERROR_CODE_INTERNAL_UNAVAILABLE = 7;
}

enum InstallationInspectionReason {
  INSTALLATION_INSPECTION_REASON_UNSPECIFIED = 0;
  INSTALLATION_INSPECTION_REASON_INSPECTION_PENDING = 1;
  INSTALLATION_INSPECTION_REASON_RUNTIME_ONLY = 2;
  INSTALLATION_INSPECTION_REASON_INITIALIZATION_PENDING = 3;
  INSTALLATION_INSPECTION_REASON_GRAPH_VERIFICATION_UNAVAILABLE = 4;
  INSTALLATION_INSPECTION_REASON_INSTALLATION_REMNANTS = 5;
  INSTALLATION_INSPECTION_REASON_UNKNOWN_CONTENT = 6;
  INSTALLATION_INSPECTION_REASON_UNSUPPORTED_LAYOUT = 7;
  INSTALLATION_INSPECTION_REASON_UNSUPPORTED_FORMAT = 8;
  INSTALLATION_INSPECTION_REASON_INCOMPLETE_TAIL = 9;
  INSTALLATION_INSPECTION_REASON_CORRUPT_AUTHORITY = 10;
  INSTALLATION_INSPECTION_REASON_INSPECTION_LIMIT = 11;
  INSTALLATION_INSPECTION_REASON_INSPECTION_CANCELLED = 12;
  INSTALLATION_INSPECTION_REASON_UNSAFE_AUTHORITY = 13;
  INSTALLATION_INSPECTION_REASON_AUTHORITY_CHANGED = 14;
  INSTALLATION_INSPECTION_REASON_INSPECTION_IO = 15;
  INSTALLATION_INSPECTION_REASON_GRAPH_VERIFIED = 16;
  // The read-only scan found no usable journal checkpoint for a long tail;
  // the writer rebuilds it (segmented journal).
  INSTALLATION_INSPECTION_REASON_CHECKPOINT_REBUILD_PENDING = 17;
}

message ConversationObserve {
  optional bytes operation_id = 1;
  optional uint64 after_cursor = 2;
  optional uint32 wait_ms = 3;
  // Response bytes the client holds (response-text-transfer.md).
  optional uint64 text_offset = 4;
  // Thinking bytes the client holds (thinking-level.md).
  optional uint64 thinking_offset = 5;
}
message ConversationHistory {
  optional bytes project_id = 1;
  optional bytes conversation_id = 2;
  optional uint64 before_accepted_frame = 3;
  optional uint32 limit = 4;
}
message ConversationHistoryEntry {
  optional bytes operation_id = 1;
  optional uint64 generation = 2;
  optional uint64 accepted_frame = 3;
  optional ConversationEventKind kind = 4;
  // A person command entry: its kind 31 input; the log reads the job API.
  optional bytes person_command_input_id = 5;
}
message ConversationHistoryReply {
  optional bytes project_id = 1;
  optional bytes conversation_id = 2;
  optional uint64 generation = 3;
  optional uint64 authority_revision = 4;
  optional bool has_more = 5;
  repeated ConversationHistoryEntry entries = 6;
}
message ConversationReadPrompt {
  optional bytes project_id = 1;
  optional bytes operation_id = 2;
}
message ConversationPromptReply {
  optional bytes project_id = 1;
  optional bytes operation_id = 2;
  optional bytes conversation_id = 3;
  optional uint64 generation = 4;
  optional string prompt = 5;
}
message ConversationEvent {
  optional bytes operation_id = 1;
  optional uint64 cursor = 2;
  optional uint64 generation = 3;
  optional ConversationEventKind kind = 4;
  optional string text = 5;
  optional ConversationReason reason = 6;
  optional uint64 usage_tokens = 7;
  optional bool usage_known = 8;
  repeated ToolProgress tools = 9;
  optional ModelContext model_context = 10;
  optional TurnStatistics statistics = 11;
  // Live, unjournaled step a PENDING turn waits on; values 3-4 only.
  optional ConversationWaitStep waiting_step = 12;
  // One response window: keep text_offset bytes, append text (at most
  // 61,440 bytes); the response then has text_bytes bytes.
  optional uint64 text_offset = 13;
  optional uint64 text_bytes = 14;
  // One thinking window, before the response window; the two texts share
  // the 61,440-byte budget (thinking-level.md).
  optional string thinking_text = 15;
  optional uint64 thinking_offset = 16;
  optional uint64 thinking_bytes = 17;
  // The level and the form the turn recorded at acceptance.
  optional ThinkingLevel thinking_level = 18;
  optional ThinkingRequest thinking_request = 19;
  // EX12: jobs the operation started that had no kind 28 before the terminal
  // frame. Terminal kinds only; outlived_job_ids holds at most 8 of them.
  optional uint32 outlived_jobs = 20;
  repeated bytes outlived_job_ids = 21;
}
message ConversationCancel { optional bytes operation_id = 1; optional uint64 generation = 2; }
message ConversationCancelAccepted { optional bytes operation_id = 1; optional bool terminal = 2; }
enum ConversationEventKind {
  CONVERSATION_EVENT_KIND_UNSPECIFIED = 0;
  CONVERSATION_EVENT_KIND_PENDING = 1;
  CONVERSATION_EVENT_KIND_SNAPSHOT = 2;
  CONVERSATION_EVENT_KIND_COMPLETE = 3;
  CONVERSATION_EVENT_KIND_FAILED = 4;
  CONVERSATION_EVENT_KIND_CANCELLED = 5;
  CONVERSATION_EVENT_KIND_INTERRUPTED = 6;
}
// Display only; never ends work (owner, 2026-10-16). Absent: no known step.
enum ConversationWaitStep {
  CONVERSATION_WAIT_STEP_UNSPECIFIED = 0;
  CONVERSATION_WAIT_STEP_PREPARING_MODEL = 1;
  CONVERSATION_WAIT_STEP_STARTING_MODEL = 2;
  CONVERSATION_WAIT_STEP_SENDING_INPUT = 3;
  CONVERSATION_WAIT_STEP_MODEL_OUTPUT = 4;
  // The journal holds normal records at its quota or disk floor; the turn is paused.
  CONVERSATION_WAIT_STEP_JOURNAL_PAUSED = 5;
}
enum ConversationReason {
  CONVERSATION_REASON_NONE = 0;
  CONVERSATION_REASON_MODEL_UNAVAILABLE = 1;
  CONVERSATION_REASON_INPUT_LIMIT = 2;
  CONVERSATION_REASON_OUTPUT_LIMIT = 3;
  CONVERSATION_REASON_CONTEXT_LIMIT = 4;
  CONVERSATION_REASON_TIMEOUT = 5;
  CONVERSATION_REASON_REFUSAL = 6;
  CONVERSATION_REASON_CANCELLED = 7;
  CONVERSATION_REASON_PROTOCOL_FAULT = 8;
  CONVERSATION_REASON_HELPER_FAILED = 9;
  CONVERSATION_REASON_INTERNAL_ERROR = 10;
  CONVERSATION_REASON_INTERRUPTED = 11;
  CONVERSATION_REASON_RESULT_EXPIRED = 12;
}

message InitializeInstallation {
  optional bytes request_id = 1;
  optional string mode = 2;
  optional uint64 expected_authority_revision = 3;
}
message ResolveInitialization { optional bytes request_id = 1; optional bytes request_digest = 2; }
message InitializationReply {
  optional bytes installation_id = 1;
  optional bytes graph_id = 2;
  optional InitializationPhase phase = 3;
  optional uint64 authority_revision = 4;
  optional string error = 5;
}
enum InitializationPhase {
  INITIALIZATION_PHASE_UNSPECIFIED = 0;
  INITIALIZATION_PHASE_PENDING = 1;
  INITIALIZATION_PHASE_COMPLETED = 2;
}
message ProjectRegister { optional bytes request_id = 1; optional string location = 2; }
message ProjectReply {
  optional bytes project_id = 1;
  optional string location = 2;
  optional uint64 registry_revision = 3;
  optional bool current = 4;
  optional string error = 5;
  optional string name = 6;
  optional uint64 name_revision = 7;
}
message ProjectRename {
  optional bytes request_id = 1;
  optional bytes project_id = 2;
  optional uint64 expected_name_revision = 3;
  optional string name = 4;
}
message ProjectRenameReply {
  optional ProjectReply project = 1;
  optional bool changed = 2;
  optional string error = 3;
  optional ProjectReply current_project = 4;
}
// Pages registered projects with no page total (segmented journal, 2026-10-19).
// At most one of after_project_id, before_project_id and only_project_id.
// `before` pages in descending ID order; `only` reads one exact project or none.
// next_cursor is the last entry's ID when another page exists in the same order.
message ProjectList {
  optional bytes after_project_id = 1;
  optional uint32 limit = 2;
  optional bytes before_project_id = 3;
  optional bytes only_project_id = 4;
}
message ProjectsReply { repeated ProjectReply projects = 1; optional bytes next_cursor = 2; optional string error = 3; }

// Durable service-owned input queue. Values evolve within protocol 0.1.
// Queue a prompt before model admission. A new conversation has no ID yet and
// must explicitly carry generation zero and new_conversation=true.
message ConversationQueueSubmit {
  optional bytes request_id = 1;
  optional bytes project_id = 2;
  optional bytes conversation_id = 3;
  optional uint64 expected_generation = 4;
  optional bool new_conversation = 5;
  optional string prompt = 6;
}
// Person-typed `!` or `!!` command, queued in a conversation lane.
message ConversationQueueCommandSubmit {
  optional bytes request_id = 1;
  optional bytes project_id = 2;
  optional bytes conversation_id = 3;
  optional uint64 expected_generation = 4;
  optional bool new_conversation = 5;
  optional string command = 6;      // 1-8192 UTF-8 bytes, no NUL
  optional string cwd = 7;          // project-relative, "." for root, 1-1024 bytes
  optional string search_path = 8;  // `!` only: client PATH, at most 4096 bytes
  repeated PersonEnvironment environment = 9;  // `!` only: PC3 client names, at most 9
  optional bool outside_sandbox = 10;          // true for a `!!` command
  repeated LaunchVariable launch_environment = 11;  // `!!` only: at most 1,024 entries, 40,960 bytes
}
message PersonEnvironment { optional string name = 1; optional string value = 2; }
// Bytes: a terminal environment need not be UTF-8.
message LaunchVariable { optional bytes name = 1; optional bytes value = 2; }
message ConversationQueueReorder {
  optional bytes request_id = 1;
  optional bytes input_id = 2;
  optional bytes after_input_id = 3; // absent means front of movable lane
  optional uint64 expected_order_revision = 4;
}
message ConversationQueueList {
  optional bytes project_id = 1;
  optional bytes input_id = 2; // exact inspection includes full prompt
  optional uint64 after_revision = 3;
}
message ConversationQueueDecision {
  optional bytes request_id = 1;
  optional bytes input_id = 2;
  optional uint32 action = 3; // 1 Resume, 2 Drop, 3 promote existing Queue to Steer, 4 Hold the input being prepared
  optional bytes target_operation_id = 4; // required only for promotion
  optional uint64 target_generation = 5; // required only for promotion
}
message ConversationQueueEntry {
  optional bytes input_id = 1;
  optional bytes project_id = 2;
  optional bytes conversation_id = 3;
  optional bytes target_operation_id = 4;
  optional uint64 target_generation = 5;
  optional uint32 kind = 6;
  optional uint32 state = 7; // 1 Queued, 2 Held, 3 Running, 4 Complete, 5 Failed, 6 Dropped
  optional string text = 8;
  optional bytes operation_id = 9;
  optional uint64 generation = 10;
  optional uint64 sequence = 11;
  optional bool new_conversation = 12; // target_generation is the expected generation
  optional uint32 order_position = 13; // pending lane order, independent of immutable sequence
  optional string hold_reason = 14; // Current-owner diagnostic only; absent after restart
  optional ConversationWaitStep waiting_step = 15; // Live, Queued only, values 1-2; never journaled
  // Kind 3 (person command) only.
  optional string command_cwd = 16;             // kind 31 cwd
  optional bool command_outside_sandbox = 17;   // true for `!!`
  optional QueueWaitReason waiting_reason = 18; // live, Queued only; never journaled
  optional string waiting_text = 19;            // brief text with live numbers, at most 128 bytes
  optional bool command_filtered = 20;          // display-only copy of a whole-command input
  // Execution path guard (kind 3 only): the warnings shown before the
  // command, at most 16, and the count of warnings not listed.
  repeated PathWarning path_warnings = 21;
  optional uint32 path_overflow = 22;
}
enum QueueWaitReason {
  QUEUE_WAIT_REASON_UNSPECIFIED = 0;
  // 1-9 equal the J2 block reasons, in the order of the start-condition table.
  QUEUE_WAIT_REASON_RECOVERING = 1;
  QUEUE_WAIT_REASON_JOURNAL_UNAVAILABLE = 2;
  QUEUE_WAIT_REASON_JOURNAL_HELD = 3;
  QUEUE_WAIT_REASON_PAYLOAD_UNAVAILABLE = 4;
  QUEUE_WAIT_REASON_AGENT_SLOTS = 5;
  QUEUE_WAIT_REASON_SERVICE_SLOTS = 6;
  QUEUE_WAIT_REASON_PENDING_INSTALLS = 7;
  QUEUE_WAIT_REASON_QUOTA = 8;
  QUEUE_WAIT_REASON_DISK_SPACE = 9;
  QUEUE_WAIT_REASON_MODEL_TURN = 10;          // "waiting: model turn running"
  QUEUE_WAIT_REASON_KEYCHAIN_LOCKED = 11;     // "waiting: Keychain locked"
  QUEUE_WAIT_REASON_KEYCHAIN_UNAVAILABLE = 12;// "waiting: Keychain unavailable"
  QUEUE_WAIT_REASON_KEYCHAIN_BUSY = 13;       // "waiting: Keychain requests queued"
  QUEUE_WAIT_REASON_HELD_HEAD = 14;           // "waiting: an earlier input is held"
  QUEUE_WAIT_REASON_PATH_CHECK = 15;          // "waiting: path check" (execution-path-guard.md)
}
message ConversationQueueReply {
  repeated ConversationQueueEntry entries = 1;
  optional bytes request_id = 2; // mutation acknowledgement
  optional bool full_text = 3;
  optional uint64 revision = 4;
  optional bool pending = 5;
  optional uint64 order_revision = 6; // independent of authority revision
  optional bool stale_order = 7; // reorder CAS lost; entries contain current projection
  optional bytes accepted_input_id = 8; // new Submit receipt within the bounded projection
  optional QueueRefusal refusal = 9;     // a definite refusal; nothing was queued or stored
  optional uint32 refusal_status = 10;   // with SECRET_STORE_UNAVAILABLE: |OSStatus|
}
// Execution path guard (execution-path-guard.md, control messages), part of
// capability 8. Paths are project-relative and display-redacted.
message PathGuardList { optional bytes project_id = 1; }
// `all` takes no `path`: every implicit-execution file shown as not approved
// or changed since approval.
message PathGuardApprove {
  optional bytes request_id = 1;
  optional bytes project_id = 2;
  optional string path = 3;
  optional bool all = 4;
}
message PathGuardRevoke {
  optional bytes request_id = 1;
  optional bytes project_id = 2;
  optional string path = 3;
}
// kind: 1 model_changed, 2 not_approved, 3 changed_since_approval,
// 4 too_large, 5 overflow.
message PathWarning { optional uint32 kind = 1; optional string path = 2; }
message PathGuardReply {
  repeated PathWarning pending = 1;   // what the next person command would show, at most 16
  optional uint32 overflow = 2;       // pending warnings not listed
  repeated string approved = 3;       // at most 256 approved paths, in byte order
  optional string error = 4;          // not_found, path_invalid, too_large, not_implicit, limit, busy, unavailable
  optional uint32 approved_omitted = 5; // approved paths not listed because the list reached 40 KiB
}
enum QueueRefusal {
  QUEUE_REFUSAL_UNSPECIFIED = 0;
  QUEUE_REFUSAL_OUTSIDE_SANDBOX_OFF = 1;
  QUEUE_REFUSAL_ENVIRONMENT_INVALID = 2;
  QUEUE_REFUSAL_ENVIRONMENT_TOO_LARGE = 3;
  QUEUE_REFUSAL_PATH_INVALID = 4;
  QUEUE_REFUSAL_CWD_INVALID = 5;
  QUEUE_REFUSAL_SECRET_STORE_LOCKED = 6;
  QUEUE_REFUSAL_SECRET_STORE_DENIED = 7;
  QUEUE_REFUSAL_SECRET_STORE_UNAVAILABLE = 8;
  QUEUE_REFUSAL_SECRET_STORE_FULL = 9;
  QUEUE_REFUSAL_SECRET_STORE_BUSY = 10;
  QUEUE_REFUSAL_SECRET_IN_CWD = 11;
  QUEUE_REFUSAL_PLACEHOLDER_NOT_AVAILABLE = 12;
  QUEUE_REFUSAL_SECRET_DETECTION_UNAVAILABLE = 13;
}

message ToolProgress {
  optional uint32 ordinal = 1; optional string name = 2;
  optional ToolProgressState state = 3; optional uint32 status = 4;
  optional string arguments = 5; optional uint32 policy_decision = 6;
  optional uint64 elapsed_ms = 7; optional uint64 result_bytes = 8;
  optional string preview = 9; optional bool truncated = 10;
  optional sint32 exit_code = 11;
  // Kind 14 fault code 1-16 of a rejected call (tool-call-records.md, TCR-D13).
  // policy_decision carries the kind 14 decision code 1-8.
  optional uint32 fault = 12;
  // SL7: true when an admitted exec_cmd call ran from the whole-command
  // variable (kind 14 field 20 bit 1); arguments then show its display text.
  // Absent otherwise; only with policy_decision 1.
  optional bool command_filtered = 13;
  // The job an admitted exec_cmd or job call names (operation codes 10, 12-16).
  optional bytes job_id = 14;
}
// Optional observations; complete means every measured request has full input/output counts.
message TurnStatistics {
  optional uint64 elapsed_ms = 1; optional uint64 input_tokens = 2;
  optional uint64 output_tokens = 3; optional uint64 cached_input_tokens = 4;
  optional bool complete = 5; optional uint32 request_count = 6;
}
enum ToolProgressState { TOOL_PROGRESS_STATE_UNSPECIFIED = 0; TOOL_PROGRESS_STATE_RUNNING = 1; TOOL_PROGRESS_STATE_COMPLETE = 2; TOOL_PROGRESS_STATE_FAILED = 3; TOOL_PROGRESS_STATE_INTERRUPTED = 4; }

// basis 1 means the measured input at generation start, not current occupancy.
// capacity_tokens is the selected effective request window. Input counts are optional.
// capacity_source: 1 system runtime, 2 CoreAI bundle, 3 MLX config, 4 Ollama show.
message ModelContext { optional string model_name = 1; optional uint32 input_tokens = 2; optional uint32 capacity_tokens = 3; optional uint32 basis = 4; optional uint32 reported_max_tokens = 5; optional uint32 capacity_source = 6; optional bool reasoning = 7; optional uint32 thinking_controls = 8; }

// Inventory states: 1 available, 2 installed, 3 listed, 4 unavailable, 5 unchecked.
message ModelsList {}
message ModelInventoryEntry {
  optional string selector = 1;
  optional string provider = 2;
  optional uint32 status = 3;
  optional string detail = 4;
}
message ModelInventoryIssue { optional string provider = 1; optional string reason = 2; }
message ModelsReply {
  optional string configured_model = 1;
  repeated ModelInventoryEntry models = 2;
  repeated ModelInventoryIssue issues = 3;
  optional string error = 4;
}

// Inspection returns committed evidence only; it never admits sensor work.
message SensorsInspect {
  optional bytes project_id = 1;
  optional uint64 revision = 2;
  optional uint32 offset = 3;
  optional uint32 limit = 4;
}
message SensorObservation {
  optional bytes id = 1;
  optional uint32 source = 2; // 1 activity, 2 idle, 3 status
  optional bytes source_epoch = 3;
  optional uint64 sequence = 4;
  optional uint64 observed_ms = 5;
  optional uint64 received_ms = 6;
  optional uint64 expires_ms = 7;
  optional bytes operation = 8;
  optional uint64 generation = 9;
  optional uint32 phase = 10; // activity: 1 accepted, 2 settled
  optional uint32 active_foreground = 11;
  optional uint64 since_ms = 12;
  optional uint32 lifecycle = 13;
  optional uint32 installation = 14;
  optional uint32 status_reason = 15;
  optional uint32 ordinal = 16;
  optional bytes causal_root = 17;
  optional bool background = 18;
  optional uint32 causal_hops = 19;
}
message SensorReference { optional bytes id = 1; }
message SensorProposal {
  optional bytes id = 1;
  optional uint32 purpose = 2; // 1 consolidation, 2 reflection
  optional uint32 state = 3; // 1 held, 2 expired, 3 invalidated
  optional uint32 reason = 4; // 1 admission unavailable, 2 clock uncertain, 3 activity resumed, 4 expired
  repeated SensorReference observations = 5;
  optional uint64 omitted = 6;
  optional uint64 created_ms = 7;
  optional uint64 expires_ms = 8;
}
message SensorsReply {
  optional bytes project_id = 1;
  optional uint64 revision = 2;
  optional uint32 total_observations = 3;
  optional uint32 next_offset = 4;
  optional bool pending_persistence = 5;
  optional bool intake_unavailable = 6;
  optional bool clock_uncertain = 7;
  repeated SensorObservation observations = 8;
  repeated SensorProposal proposals = 9;
  optional string error = 10;
  optional uint32 offset = 11;
}

// Project-filtered committed recent audit metadata; no raw log text.
message AuditRead { optional bytes project_id = 1; optional uint32 limit = 2; }
message AuditHealth {
  optional uint32 state = 1;
  optional bool enabled = 2;
  optional uint32 keep_files = 3;
  optional uint64 max_file_bytes = 4;
  optional uint64 dropped = 5;
  optional uint32 window_capacity = 6;
  optional bool hydrated = 7;
  optional bool older_omitted = 8;
  optional uint32 reason = 9;
}
message AuditEntry {
  optional bytes service_epoch = 1;
  optional uint64 sequence = 2;
  optional uint64 unix_time_ms = 3;
  optional uint32 kind = 4;
  optional bytes project = 5;
  optional bytes request = 6;
  optional bytes conversation = 7;
  optional bytes operation = 8;
  optional uint64 requested_generation = 9;
  optional uint64 current_generation = 10;
  optional uint64 generation = 11;
  optional uint32 ordinal = 12;
  optional uint32 tool = 13;
  optional uint32 outcome = 14;
  optional uint32 reason = 15;
  // Job events: kinds 4 job.queued, 5 job.started, 6 job.cancel_requested,
  // 7 job.settled (J4-E8).
  optional bytes job = 16;
}
message AuditReply {
  optional bytes project_id = 1;
  optional AuditHealth health = 2;
  repeated AuditEntry entries = 3;
  optional string error = 4;
}

// Tool job controller J4 (tool-job-controller.md, J4 control messages).
// Enum values equal the journal codes. Domain errors are reply `error` tokens.
enum JobScope { JOB_SCOPE_UNSPECIFIED = 0; JOB_SCOPE_PROJECT = 1; JOB_SCOPE_ALL_PROJECTS = 2; JOB_SCOPE_CONVERSATION = 3; }
enum JobOrigin { JOB_ORIGIN_UNSPECIFIED = 0; JOB_ORIGIN_MODEL = 1; JOB_ORIGIN_PERSON = 2; }
enum JobState {
  JOB_STATE_UNSPECIFIED = 0; JOB_STATE_QUEUED = 1; JOB_STATE_STARTING = 2; JOB_STATE_RUNNING = 3;
  JOB_STATE_CAPTURE_PAUSED = 4; JOB_STATE_STOPPING = 5; JOB_STATE_DRAINING = 6;
  JOB_STATE_CLEANUP_UNCONFIRMED = 7; JOB_STATE_FINALIZING = 8; JOB_STATE_SETTLED = 9;
}
enum JobStream { JOB_STREAM_UNSPECIFIED = 0; JOB_STREAM_STDOUT = 1; JOB_STREAM_STDERR = 2; }
enum JobPageState {
  JOB_PAGE_STATE_UNSPECIFIED = 0; JOB_PAGE_STATE_LIVE = 1; JOB_PAGE_STATE_COMPLETE = 2;
  JOB_PAGE_STATE_INCOMPLETE = 3; JOB_PAGE_STATE_UNVERIFIED_PREFIX = 4; JOB_PAGE_STATE_EXPIRED = 5;
  JOB_PAGE_STATE_MISSING = 6; JOB_PAGE_STATE_CORRUPT = 7; JOB_PAGE_STATE_DELETED = 8;
}
enum JobRetainAction {
  JOB_RETAIN_ACTION_UNSPECIFIED = 0; JOB_RETAIN_ACTION_PIN = 1; JOB_RETAIN_ACTION_UNPIN = 2;
  JOB_RETAIN_ACTION_DELETE = 3; JOB_RETAIN_ACTION_NOTE = 4;
}
message JobList {
  optional JobScope scope = 1;
  optional bytes project_id = 2;        // scopes PROJECT and CONVERSATION
  optional bytes conversation_id = 3;   // scope CONVERSATION
  optional uint64 before = 4;           // kind 26 sequence of the last entry of the previous page
  optional uint32 limit = 5;            // 1-8; absent 8
  optional bool live_only = 6;          // unsettled jobs only
  optional uint64 after_revision = 7;   // park until the job revision differs
}
message JobListReply {
  repeated JobEntry entries = 1;        // at most limit
  optional uint64 next_before = 2;      // present when more entries exist
  optional uint64 revision = 3;
  optional uint32 live_in_scope = 4;
  optional uint32 live_in_service = 5;
  optional bool execution_enabled = 6;  // EX11 effective value; scopes PROJECT and CONVERSATION
  optional string error = 7;
}
message JobEntry {
  optional bytes job_id = 1;
  optional bytes project_id = 2;
  optional bytes conversation_id = 3;
  optional JobOrigin origin = 4;
  optional bool outside_sandbox = 5;
  optional string command = 6;          // first line of the stored command, at most 192 bytes
  optional JobState state = 7;
  optional uint32 block_reason = 8;     // J2 block reason 1-9 when QUEUED; pause reason when CAPTURE_PAUSED
  optional string reason_text = 9;      // the brief reason, for example "waiting: 2 of 2 jobs running for this agent"
  optional uint32 outcome = 10;         // kind 28 outcome 1-5, SETTLED only
  optional uint32 reason = 11;          // job reason code 0-20
  optional uint32 exit_kind = 12;
  optional uint32 exit_value = 13;
  optional uint64 stdout_bytes = 14;
  optional uint64 stderr_bytes = 15;
  optional uint64 stdout_lines = 16;    // SETTLED only
  optional uint64 stderr_lines = 17;    // SETTLED only
  optional uint64 intent_unix_ms = 18;
  optional uint64 settled_unix_ms = 19;
  optional uint64 elapsed_ms = 20;
  optional uint32 capture_state = 21;   // kind 28 capture state 1-5; absent while live
  optional bool pinned = 22;
  optional bool deleted = 23;
  optional uint32 notes = 24;
  optional uint64 sequence = 25;        // kind 26 frame sequence
  optional bool cancel_requested = 26;
  optional bytes input_id = 27;         // person-origin jobs (PCM)
  // Person `!!` jobs only (OD2): survivors from kind 6, live DRAINING after
  // kind 2 or SETTLED; and DRAINING after kind 2 reason 15.
  optional uint32 left_running = 28;
  optional bool shell_exited = 29;
}
message JobInspect { optional bytes job_id = 1; optional bytes project_id = 2; }
message JobDetail {
  optional JobEntry entry = 1;
  optional string command = 2;          // whole stored command, at most 8192 bytes
  optional string cwd = 3;
  repeated JobNote notes = 4;           // at most 16, oldest first
  optional string error = 5;
  repeated PathWarning path_warnings = 6; // person jobs: from the kind 32 acknowledgement, at most 16
  optional uint32 path_overflow = 7;      // the acknowledgement's entries not listed; absent when none, never 0
}
message JobNote { optional uint32 author = 1; optional uint64 unix_ms = 2; optional string text = 3; }
message JobRead {
  optional bytes job_id = 1;
  optional bytes project_id = 2;
  optional JobStream stream = 3;
  optional uint64 offset = 4;
  optional uint32 limit = 5;            // 1-8192; absent 8192
  optional bool at_end = 6;             // the last page up to the watermark instead of offset
}
message JobObserve {
  optional bytes job_id = 1;
  optional bytes project_id = 2;
  optional JobStream stream = 3;        // absent with at_end: both streams
  optional uint64 offset = 4;           // bytes the client holds of that stream
  optional bool at_end = 5;
  optional JobState after_state = 6;    // the state the client last saw
}
message JobPage {
  optional JobEntry entry = 1;
  repeated JobStreamPage pages = 2;     // one, or two for at_end without a stream
  optional string error = 3;
}
message JobStreamPage {
  optional JobStream stream = 1;
  optional uint64 start = 2;
  optional string text = 3;
  optional uint64 next_offset = 4;
  optional uint64 total_bytes = 5;
  optional JobPageState state = 6;
}
message JobCancel {
  optional bytes request_id = 1;
  optional bytes job_id = 2;
  optional bytes expected_project_id = 3;
  optional bool kill = 4;               // person-origin jobs only
}
message JobCancelReply {
  optional bytes request_id = 1;
  optional JobEntry entry = 2;
  optional bool requested = 3;          // false when the job had settled
  optional string error = 4;
}
message JobRetain {
  optional bytes request_id = 1;
  optional bytes job_id = 2;
  optional bytes expected_project_id = 3;
  optional JobRetainAction action = 4;
  optional string note = 5;             // NOTE only: 1-2048 UTF-8 bytes
  optional bool confirmed = 6;          // required true for DELETE
}
message JobRetainReply {
  optional bytes request_id = 1;
  optional JobEntry entry = 2;
  optional bool changed = 3;
  optional string error = 4;
}
