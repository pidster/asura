syntax = "proto3";
package asura.model.v1;

enum Availability { AVAILABILITY_UNSPECIFIED = 0; AVAILABILITY_AVAILABLE = 1; AVAILABILITY_UNAVAILABLE = 2; AVAILABILITY_UNKNOWN = 3; }
enum TransferDirection { TRANSFER_DIRECTION_UNSPECIFIED = 0; TRANSFER_DIRECTION_INPUT = 1; TRANSFER_DIRECTION_OUTPUT = 2; }
enum CancelReason { CANCEL_REASON_UNSPECIFIED = 0; CANCEL_REASON_USER = 1; CANCEL_REASON_TIMEOUT = 2; CANCEL_REASON_SHUTDOWN = 3; CANCEL_REASON_RESOURCE_LIMIT = 4; }
// OUTCOME_TOOL_CALLS (4) ends one request with tool calls, not the helper
// session; the service starts the next request (context-composer.md, CC4).
enum Outcome { OUTCOME_UNSPECIFIED = 0; OUTCOME_COMPLETE = 1; OUTCOME_FAILED = 2; OUTCOME_CANCELLED = 3; OUTCOME_TOOL_CALLS = 4; }
enum Reason { REASON_NONE = 0; REASON_MODEL_UNAVAILABLE = 1; REASON_INPUT_LIMIT = 2; REASON_OUTPUT_LIMIT = 3; REASON_CONTEXT_LIMIT = 4; REASON_TIMEOUT = 5; REASON_REFUSAL = 6; REASON_CANCELLED = 7; REASON_PROTOCOL_FAULT = 8; REASON_HELPER_FAILED = 9; REASON_INTERNAL_ERROR = 10; REASON_INTERRUPTED = 11; REASON_RESULT_EXPIRED = 12; }
// ROLE_TOOL (3): one tool output of the current turn (CC4 continuation).
enum Role { ROLE_UNSPECIFIED = 0; ROLE_USER = 1; ROLE_ASSISTANT = 2; ROLE_TOOL = 3; }
// The form of the thinking level sent for one turn (thinking-level.md).
enum ThinkingRequest { THINKING_REQUEST_NONE = 0; THINKING_REQUEST_OFF = 1; THINKING_REQUEST_ON = 2; THINKING_REQUEST_LOW = 3; THINKING_REQUEST_MEDIUM = 4; THINKING_REQUEST_HIGH = 5; }
message Envelope {
  reserved 21;
  optional bytes operation_id = 1;
  optional uint64 generation = 2;
  oneof body {
    Hello hello = 10;
    Begin begin = 11;
    Chunk chunk = 12;
    Credit credit = 13;
    InputEnd input_end = 14;
    Ready ready = 15;
    Start start = 16;
    Cancel cancel = 17;
    SnapshotEnd snapshot_end = 18;
    Terminal terminal = 19;
    ToolCall tool_call = 20;
    // ToolResult (21) was removed by CC4: results reach the model in the next
    // request's continuation.
    ContextMeasured context_measured = 22;
    InferenceUsage inference_usage = 23;
  }
}
message Hello {
  optional bytes build_id = 1;
  optional bytes schema_digest = 2;
  optional uint32 max_frame_bytes = 3;
  optional Availability availability = 4;
  reserved 5;
  optional uint32 context_tokens = 6;
  optional Reason reason = 7;
  optional string model_name = 8;
  // Required in every Hello: the exact selector the peer serves.
  optional string selected_model = 9;
  optional string asset_root = 10;
  optional string endpoint = 11;
  optional bool inventory_only = 12;
  repeated ModelInventoryEntry models = 13;
  repeated ModelInventoryIssue issues = 14;
  optional bool local_tool_destination = 15;
  optional uint32 model_capabilities = 16;
  optional uint32 supported_capabilities = 17;
  optional uint32 capability_source = 18;
  // The forced MLX reasoning disable was removed (thinking-level.md, D4).
  reserved 19;
  optional uint32 reported_context_tokens = 20;
  optional uint32 context_source = 21;
  // UTF-8 bytes of the project tool definitions the helper would declare.
  optional uint32 tool_schema_bytes = 22;
  // Thinking forms the loaded model accepts: off 1, on 2, low 4, medium 8,
  // high 16 (thinking-level.md). Nonzero requires reasoning support.
  optional uint32 thinking_controls = 23;
  // Service only, with `endpoint`: the 32-byte token the helper sends to the
  // service's llama.cpp relay as its bearer credential (llamacpp-backend.md).
  // It is not the server key and is not derived from it.
  optional bytes endpoint_token = 24;
}
message Begin {
  optional string model = 1;
  optional uint64 input_bytes = 2;
  // Generation is cancellation-driven; Begin carries no time bound.
  reserved 3;
  // No output-token cap: the model writes until it stops or its context
  // window is full (owner, 2026-10-19; was max_response_tokens).
  reserved 4;
  optional bool enable_project_tools = 5;
  // Absent: send nothing. Present: OFF to HIGH, within the helper's controls.
  optional ThinkingRequest thinking = 6;
  // The service's request ordinal within the operation: 1 for the first
  // Begin of a helper session, then each next (CC4). Later Begins repeat
  // the model, tools and thinking of the first.
  optional uint32 request_ordinal = 7;
}
message Chunk { optional uint64 transfer_id = 1; optional TransferDirection direction = 2; optional uint64 ordinal = 3; optional bytes data = 4; optional uint64 revision = 5; }
message Credit { optional uint64 transfer_id = 1; optional TransferDirection direction = 2; optional uint64 accepted_bytes = 3; optional uint64 granted_bytes = 4; }
message InputEnd { optional uint64 count = 1; optional uint64 total_bytes = 2; }
message Ready {}
message Start {}
message Cancel { optional CancelReason reason = 1; }
// One output revision: keep `offset` bytes of the committed response, then
// append this transfer's `total_bytes` (at most 61,440). Revisions have no
// upper bound (response-text-transfer.md).
// With thinking_offset and thinking_bytes (both or neither), the first
// thinking_bytes bytes revise the thinking text the same way (thinking-level.md).
message SnapshotEnd { optional uint64 revision = 1; optional uint64 count = 2; optional uint64 total_bytes = 3; optional uint64 offset = 4; optional uint64 thinking_offset = 5; optional uint64 thinking_bytes = 6; }
// tool_calls: the ToolCall frames of this request, 1-201, only with
// OUTCOME_TOOL_CALLS (CC4).
message Terminal { optional Outcome outcome = 1; optional uint64 last_revision = 2; optional uint64 count = 3; optional uint64 total_bytes = 4; optional uint64 usage_tokens = 5; optional bool usage_known = 6; optional Reason reason = 7; optional uint32 tool_calls = 8; }
// continuation: the current turn's entries after the prompt (CC4): for each
// settled request, one assistant entry with its tool calls and empty text,
// then one tool entry per call in call order. History holds roles 1 and 2
// with text only.
message ModelInput { optional string instructions = 1; repeated HistoryTurn history = 2; optional string prompt = 3; repeated HistoryTurn continuation = 4; }
message HistoryTurn { optional Role role = 1; optional string text = 2; repeated HistoryToolCall tool_calls = 3; optional string call_id = 4; optional string tool_name = 5; }
// One tool call of an earlier request of the turn; the call ID is the
// service's `call_<turn ordinal>`, the arguments a JSON object.
message HistoryToolCall { optional string call_id = 1; optional string name = 2; optional string arguments = 3; }

// Unparsed proposals. The service is the only argument parser and owns grants,
// host execution and durable outcomes (tool-call-records.md).
enum ToolCallSource { TOOL_CALL_SOURCE_UNSPECIFIED = 0; TOOL_CALL_SOURCE_GENERATED_CONTENT = 1; TOOL_CALL_SOURCE_PROVIDER_JSON = 2; }
message ToolCall {
  // The call's position in this request's response, 1-201; the service
  // assigns the turn ordinal (CC4).
  optional uint32 ordinal = 1;
  // 1-256 bytes; absent when longer, then name_bytes is set.
  optional string name = 2;
  // 0-64,000 bytes of argument JSON text as received; absent when longer.
  optional string arguments = 3;
  // Received argument size; set only when arguments is absent.
  optional uint32 arguments_bytes = 4;
  // Received name size; set only when name is absent.
  optional uint32 name_bytes = 5;
  optional ToolCallSource source = 6;
  // Typed argument messages were removed (owner, 2026-10-17).
  reserved 10 to 19;
}

message ContextMeasured { optional uint32 input_tokens = 1; optional uint32 capacity_tokens = 2; }

// Read-only metadata inventory; never establishes permission or native qualification.
message ModelInventoryEntry {
  optional string selector = 1;
  optional string provider = 2;
  optional uint32 status = 3;
  optional string detail = 4;
}
message ModelInventoryIssue { optional string provider = 1; optional string reason = 2; }

// One settled executor request; observed counters are independent of context occupancy.
// request_ordinal equals the request's Begin.request_ordinal (CC4).
message InferenceUsage { optional uint32 request_ordinal = 1; optional uint64 input_tokens = 2; optional uint64 output_tokens = 3; optional uint64 cached_input_tokens = 4; optional bool complete = 5; }
