[package]
name = "asura-policy-engine-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Isolated spike comparing Cedar and Rego on one Asura policy corpus"

# A separate workspace: the product workspace never builds this spike.
[workspace]

[dependencies]
cedar-policy = "=4.14.1"
regorus = { version = "=0.14.1", default-features = false, features = ["arc", "std", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Admission analysis only. The decision-path probes do not link these.
cedar-policy-symcc = { version = "=0.8.1", optional = true }
tokio = { version = "=1.54.1", features = ["rt", "macros"], optional = true }

[features]
admission = ["dep:cedar-policy-symcc", "dep:tokio"]

[[bin]]
name = "admission"
required-features = ["admission"]

[[test]]
name = "admission"
required-features = ["admission"]

[profile.size]
inherits = "release"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"
style = "warn"
