[package]
name = "asura-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[[bin]]
name = "asura"
path = "src/main.rs"

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
crossterm = { version = "=0.29.0", features = ["use-dev-tty"] }
rat-text = { version = "=3.1.0", default-features = false }
unicode-segmentation = "=1.12.0"
unicode-display-width = "=0.3.0"
signal-hook = "=0.3.18"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
asura-storage = { path = "../asura-storage" }
asura-client = { path = "../asura-client" }
asura-control = { path = "../asura-control" }
asura-platform = { path = "../asura-platform" }
asura-service = { path = "../asura-service" }
serde_json = "=1.0.151"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
libc = "=0.2.189"
asura-platform = { path = "../asura-platform", features = ["test-support"] }

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
harness = false

[[test]]
name = "arguments"
path = "tests/arguments.rs"
