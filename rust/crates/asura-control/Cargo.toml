[package]
name = "asura-control"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
prost = "=0.14.3"
# Named secrets: SecretPut values and frame buffers are zeroized
# (named-secrets.md, control API). The version already locked for the platform.
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[build-dependencies]
prost = "=0.14.3"
prost-build = "=0.14.3"
prost-types = "=0.14.3"
serde_json = "=1.0.151"
