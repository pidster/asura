[package]
name = "asura-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = []

[dependencies]
aho-corasick = { version = "=1.1.5", default-features = false, features = ["std", "perf-literal"] }
libc = "=0.2.189"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf"] }
sha2 = "=0.10.9"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[[test]]
name = "shell_process"
path = "tests/shell_process.rs"
harness = false
required-features = ["test-support"]
