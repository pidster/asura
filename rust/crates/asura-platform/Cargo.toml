[package]
name = "asura-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = []

[dependencies]
aho-corasick = { version = "=1.1.5", default-features = false, features = ["std", "perf-literal"] }
core-foundation = "=0.10.1"
libc = "=0.2.189"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf"] }
security-framework = { version = "=3.7.0", default-features = false }
security-framework-sys = { version = "=2.17.0", default-features = false }
sha2 = "=0.10.9"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[[test]]
name = "exec_cmd_process"
path = "tests/exec_cmd_process.rs"
harness = false
required-features = ["test-support"]

[[example]]
name = "keychain_fixture"
path = "examples/keychain_fixture.rs"
required-features = ["test-support"]
