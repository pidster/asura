[package]
name = "asura-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Test-only capture gates (J1, G18) and platform/storage hooks; never in production builds.
test-support = ["asura-platform/test-support", "asura-storage/test-support"]

[dependencies]
sha2 = "=0.10.9"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
asura-storage = { path = "../asura-storage", features = ["embedded-memory"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
asura-platform = { path = "../asura-platform" }
asura-control = { path = "../asura-control" }

[dev-dependencies]
asura-storage = { path = "../asura-storage", features = ["embedded-memory", "test-support"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
asura-platform = { path = "../asura-platform", features = ["test-support"] }
asura-client = { path = "../asura-client" }
libc = "=0.2.189"
serde_json = "=1.0.151"

[[test]]
name = "capture_worker"
path = "tests/capture_worker.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "capture_flow"
path = "tests/capture_flow.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "tool_call_flow"
path = "tests/tool_call_flow.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "conversation_flow"
path = "tests/conversation_flow.rs"
harness = false

[[test]]
name = "job_tool_flow"
path = "tests/job_tool_flow.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "job_control_flow"
path = "tests/job_control_flow.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "job_controller_flow"
path = "tests/job_controller_flow.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "job_notice_flow"
path = "tests/job_notice_flow.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "secret_store"
path = "tests/secret_store.rs"
required-features = ["test-support"]

[[bin]]
name = "secret_store_fixture"
path = "src/bin/secret_store_fixture.rs"
required-features = ["test-support"]
test = false

[[test]]
name = "person_command_flow"
path = "tests/person_command_flow.rs"
harness = false
required-features = ["test-support"]

[[test]]
