[package]
name = "asura-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = []
embedded-memory = ["dep:surrealdb", "dep:tokio"]

[dependencies]
serde_json = { version = "=1.0.151", features = ["raw_value"] }
asura-platform = { path = "../asura-platform" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml_ng = "=0.10.0"
surrealdb = { version = "=3.2.4", optional = true, default-features = false, features = ["kv-surrealkv"] }
tokio = { version = "=1.52.1", optional = true, default-features = false, features = ["rt-multi-thread", "sync", "time"] }
sha2 = "=0.10.9"

[dev-dependencies]
asura-platform = { path = "../asura-platform", features = ["test-support"] }

[[test]]
name = "embedded_memory"
path = "tests/embedded_memory.rs"
required-features = ["embedded-memory"]
