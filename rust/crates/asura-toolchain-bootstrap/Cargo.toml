[package]
name = "asura-toolchain-bootstrap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
sha2 = "=0.10.9"
zip = { version = "=3.0.0", default-features = false, features = ["deflate-flate2"] }
tar = "=0.4.46"
flate2 = "=1.1.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.189"
toml = { version = "=1.1.4", default-features = false, features = ["std", "serde", "parse"] }
